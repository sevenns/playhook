appId: com.personal.playhook
productName: Playhook
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

# Linux only: wraps the packed executable in a launcher that injects --no-sandbox inside a gamescope
# (Game Mode) session — the flag must be on the real argv, which neither app.commandLine.appendSwitch nor
# AppRun's own user-namespace probe can deliver there. No-op for the Windows targets. See the script.
afterPack: scripts/after-pack.mjs

# Only the compiled JS, assets, and dependency manifests are included in the build.
files:
  - dist/**/*
  - package.json

# drivelist is a native module. electron-builder usually detects native code and
# unpacks it from asar on its own, but we pin an explicit unpack so the .node binary is
# available in the packaged build (verify on a real nsis/portable build).
asar: true
asarUnpack:
  - "**/node_modules/drivelist/**"
  - "**/node_modules/koffi/**"

win:
  icon: assets/icon.ico
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Linux / SteamOS build (Steam Deck port). AppImage is the only target — self-contained, runnable from
# any distro, and electron-updater supports AppImage in-place updates (blockmap deltas). `icon.png` is the
# 256×256 app icon (electron-builder may warn about size but it works). `category: Game` sets the .desktop
# category. The native drivelist/koffi unpack above applies to Linux too (koffi is unused there but stays
# a dependency of the win32 build). The umu-launcher zipapp is bundled via extraResources.
linux:
  icon: assets/icon.png
  category: Game
  # Drop the version from the file name (the default is ${productName}-${version}.${ext}). The Steam
  # shortcut's appid is a hash of the launcher PATH, so a version in it changes the appid — resetting the
  # tile's artwork and playtime — whenever the user re-downloads by hand. The stable symlink in
  # ~/.local/share/playhook is what actually guarantees the appid survives (steam-shortcut.ts); this just
  # spares the user a versioned file to begin with.
  artifactName: ${productName}.${ext}
  target:
    - AppImage
  # Bundle the umu-launcher zipapp OUTSIDE asar (it is run as `python3 umu-run …`). Fetched into
  # resources/umu by `npm run build:umu` (scripts/fetch-umu.mjs) before the Linux pack. Lands at
  # <resourcesPath>/umu/umu-run in the AppImage.
  extraResources:
    - from: resources/umu
      to: umu

# macOS build (arm64 only: the runner and the developer machine are both Apple Silicon, and a
# universal build would additionally require a universal `drivelist`). The dmg is what a user downloads;
# the zip is there because electron-updater's macOS channel expects one, and it is the easier artifact to
# script around.
#
# NOT signed with a Developer ID and NOT notarized: there is no Apple Developer account. `identity: -`
# asks for an AD-HOC signature, which is not the same as skipping signing: on Apple Silicon an app whose
# signature is broken (which repacking a signed Electron binary does) refuses to launch at all, so the
# ad-hoc one is what makes the build runnable once the user clears Gatekeeper. Without a Developer ID the
# first launch still goes through System Settings → Privacy & Security → "Open Anyway", and the app
# does not auto-update (Squirrel.Mac requires a real signature — see updater.ts).
#
# `extendInfo` is NOT optional: the default Electron Info.plist declares neither key, and macOS silently
# denies the capability when its usage string is missing — Apple Events would fail with -1743 in the
# PACKAGED build only (in dev the responsible process is the terminal, which already has consent, so
# leaving these out yields a false green). NSAppleEvents backs the power menu; NSRemovableVolumes
# backs reading a card under /Volumes.
#
# koffi stays in the mac bundle on purpose: `gamepad-global.ts` does a top-level `import koffi` on every
# OS, so dropping it would break the app at startup. The `asarUnpack` above already covers it — do not
# "optimize" it out of the macOS build.
mac:
  icon: assets/icon.icns
  category: public.app-category.games
  identity: '-'
  # Hardened runtime is electron-builder's default, and it is wrong for this build: it only buys anything
  # together with notarization (which needs a Developer ID we do not have), while its library validation
  # refuses to load the ad-hoc-signed native modules unpacked from the asar (drivelist, koffi) — the app
  # would build cleanly and then fail at startup.
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  extendInfo:
    NSAppleEventsUsageDescription: >-
      Playhook uses System Events to shut down or restart this Mac from its power menu.
    NSRemovableVolumesUsageDescription: >-
      Playhook reads game cards from removable drives to find the games on them.

# Auto-update channel (electron-updater): the app reads `latest.yml` + the installer from this repo's
# GitHub Releases. Public repo → no token on the client. Update `owner`/`repo` if the GitHub repo is
# renamed. Only the `nsis` target self-updates; the `portable` exe does not.
publish:
  provider: github
  owner: sevenns
  repo: playhook
